server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  client_max_body_size 64k;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;

  # API gateway: route each path to the microservice that owns it.
  location /api/auth/      { proxy_pass http://auth-service:4001; }
  location /api/users      { proxy_pass http://auth-service:4001; }
  location /api/logs       { proxy_pass http://worklog-service:4002; }
  location /api/summaries/ { proxy_pass http://summary-service:4003; proxy_read_timeout 120s; }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
