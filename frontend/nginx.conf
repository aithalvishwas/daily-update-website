# In production Caddy (config/Caddyfile) sits in front and passes the visitor's
# address and https scheme along; trust those only from the private Docker network.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 8080;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;

  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  client_max_body_size 64k;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;

  # API gateway: route each path to the microservice that owns it.
  location /api/auth/      { proxy_pass http://auth-service:4001; }
  location /api/users      { proxy_pass http://auth-service:4001; }
  location /api/teams      { proxy_pass http://auth-service:4001; }
  location /api/admin/     { proxy_pass http://auth-service:4001; }
  location /api/workplace  { proxy_pass http://auth-service:4001; }
  location /api/logs       { proxy_pass http://worklog-service:4002; }
  location /api/summaries/ { proxy_pass http://summary-service:4003; proxy_read_timeout 120s; }
  location ~ ^/api/(epics|tasks|issues|weekend-requests|notifications)(/|$) { proxy_pass http://project-service:4004; }
  location /api/attachments {
    client_max_body_size 11m;
    proxy_pass http://project-service:4004;
  }

  # Hashed build files never change, so browsers can keep them.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Content-Security-Policy "default-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
