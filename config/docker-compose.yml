name: daily-update

x-service-env: &service-env
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in config/.env (run ./config/setup.sh)}
  DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-dailyupdate}
  DATABASE_USER: ${POSTGRES_USER:-dailyupdate}
  DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in config/.env (run ./config/setup.sh)}

x-java-service: &java-service
  restart: unless-stopped
  depends_on:
    db: { condition: service_healthy }
  networks: [backend]

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dailyupdate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in config/.env (run ./config/setup.sh)}
      POSTGRES_DB: ${POSTGRES_DB:-dailyupdate}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]

  auth-service:
    <<: *java-service
    build:
      context: ../backend
      args: { SERVICE: auth-service }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4001/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    environment:
      <<: *service-env
      PORT: 4001
      # Workspaces are served at <company>.<ROOT_DOMAIN>: google.localhost:8080 on your computer.
      # docker-compose.prod.yml sets it to your DOMAIN.
      ROOT_DOMAIN: localhost
      DEFAULT_WORKSPACE: ${DEFAULT_WORKSPACE:-app}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      MANAGER_NAME: ${MANAGER_NAME:-Manager}
      MANAGER_EMAIL: ${MANAGER_EMAIL:-}
      MANAGER_PASSWORD: ${MANAGER_PASSWORD:-}

  worklog-service:
    <<: *java-service
    build:
      context: ../backend
      args: { SERVICE: worklog-service }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4002/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    environment:
      <<: *service-env
      PORT: 4002
      PROJECT_SERVICE_URL: http://project-service:4004

  summary-service:
    <<: *java-service
    build:
      context: ../backend
      args: { SERVICE: summary-service }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4003/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    environment:
      <<: *service-env
      PORT: 4003
      AUTH_SERVICE_URL: http://auth-service:4001
      WORKLOG_SERVICE_URL: http://worklog-service:4002
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}

  project-service:
    <<: *java-service
    build:
      context: ../backend
      args: { SERVICE: project-service }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4004/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    environment:
      <<: *service-env
      PORT: 4004
      AUTH_SERVICE_URL: http://auth-service:4001
      UPLOADS_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads

  frontend:
    build: ../frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      auth-service: { condition: service_healthy }
      worklog-service: { condition: service_healthy }
      summary-service: { condition: service_healthy }
      project-service: { condition: service_healthy }
    networks: [backend]

volumes:
  db-data:
  uploads:

networks:
  backend:
