server:
  port: ${PORT:4002}
  error:
    include-message: never
spring:
  application:
    name: worklog-service
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  sql:
    init:
      mode: always
  jackson:
    default-property-inclusion: always
app:
  jwt:
    secret: ${JWT_SECRET:}
    ttl-hours: ${JWT_TTL_HOURS:8}
management:
  endpoints:
    web:
      exposure:
        include: health
services:
  project-url: ${PROJECT_SERVICE_URL:http://localhost:4004}
