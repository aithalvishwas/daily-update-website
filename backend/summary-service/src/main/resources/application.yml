server:
  port: ${PORT:4003}
  error:
    include-message: never
spring:
  application:
    name: summary-service
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  sql:
    init:
      mode: always
  jackson:
    default-property-inclusion: always
app:
  jwt:
    secret: ${JWT_SECRET:}
    ttl-hours: ${JWT_TTL_HOURS:8}
  rate-limit:
    summaries-per-hour: ${SUMMARY_RATE_LIMIT:30}
management:
  endpoints:
    web:
      exposure:
        include: health
services:
  auth-url: ${AUTH_SERVICE_URL:http://auth-service:4001}
  worklog-url: ${WORKLOG_SERVICE_URL:http://worklog-service:4002}
anthropic:
  model: ${ANTHROPIC_MODEL:claude-opus-5-5}
